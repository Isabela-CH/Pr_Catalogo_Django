<!-- App_Catalogo/templates/App_Catalogo/inicio.html -->
{% extends "App_Catalogo/base.html" %}
{% block titulo %} Inicio {% endblock %}
{% block contenido %}
    <h1>Bienvenido a {{ nombre_sitio }}</h1>
    {% if total > 0 %}
        <p>Tenemos {{ total }} libros en el catálogo.</p>
    {% else %}
        <p>Todavía no hay libros.</p>
    {% endif %}
{% endblock %}
